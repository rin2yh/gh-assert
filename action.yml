name: gh-assert
description: Assert GitHub Actions environment variables from a contract.
inputs:
  contract:
    description: Path to the env contract file.
    required: false
  version:
    description: Release tag to download, or latest.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Run gh-assert
      shell: bash
      env:
        GH_ASSERT_CONTRACT: ${{ inputs.contract }}
        GH_ASSERT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        : "${GH_ASSERT_VERSION:=latest}"

        repo="rin2yh/gh-assert"
        asset="gh-assert-linux-amd64"
        if [[ "$GH_ASSERT_VERSION" == "latest" ]]; then
          base_url="https://github.com/$repo/releases/latest/download"
        else
          base_url="https://github.com/$repo/releases/download/$GH_ASSERT_VERSION"
        fi

        binary="$RUNNER_TEMP/$asset"
        curl --fail --location --retry 3 "$base_url/$asset" --output "$binary"
        curl --fail --location --retry 3 "$base_url/checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
        # checksums.txt は全アセット分を含むので、取得したバイナリの行だけを検証する。
        # 該当行が無ければ grep も sha256sum も失敗するため、未検証のまま通過しない
        (cd "$RUNNER_TEMP" && grep -E "  ${asset}$" checksums.txt | sha256sum -c -)
        chmod +x "$binary"
        if [[ -n "$GH_ASSERT_CONTRACT" ]]; then
          exec "$binary" "$GH_ASSERT_CONTRACT"
        fi
        exec "$binary"
