name: gh-assert
description: Assert GitHub Actions environment variables and inputs from a contract.
inputs:
  contract:
    description: Path to the contract file.
    required: false
  inputs:
    description: JSON-encoded inputs context.
    required: false
  workflow-inputs:
    description: Deprecated alias for inputs.
    required: false
runs:
  using: composite
  steps:
    - name: Install gh-assert
      id: install
      shell: bash
      env:
        GH_ASSERT_VERSION: v0.0.4
      run: |
        set -euo pipefail

        repo="rin2yh/gh-assert"

        case "$RUNNER_OS" in
          Linux) os=linux; ext="" ;;
          macOS) os=darwin; ext="" ;;
          Windows) os=windows; ext=".exe" ;;
          *) echo "::error::gh-assert: unsupported runner OS $RUNNER_OS" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::gh-assert: unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        asset="gh-assert-${os}-${arch}${ext}"

        base_url="https://github.com/$repo/releases/download/$GH_ASSERT_VERSION"

        # Windows runner の $RUNNER_TEMP はバックスラッシュ区切りなので bash 側で作る
        dir="$(mktemp -d)"
        binary="$dir/$asset"
        curl --fail --location --retry 3 "$base_url/$asset" --output "$binary"
        curl --fail --location --retry 3 "$base_url/checksums.txt" --output "$dir/checksums.txt"
        # checksums.txt は全アセット分を含むので、取得したバイナリの行だけを検証する。
        # 該当行が無ければ sha256sum が失敗するため、未検証のまま通過しない
        (cd "$dir" && awk -v file="$asset" '$2 == file' checksums.txt | sha256sum -c -)
        chmod +x "$binary"
        echo "binary=$binary" >> "$GITHUB_OUTPUT"
    - name: Assert the contract
      shell: bash
      env:
        GH_ASSERT_BINARY: ${{ steps.install.outputs.binary }}
        GH_ASSERT_CONTRACT: ${{ inputs.contract }}
        GH_ASSERT_INPUTS: ${{ inputs.inputs || inputs.workflow-inputs }}
      run: |
        set -euo pipefail
        if [[ -n "$GH_ASSERT_CONTRACT" ]]; then
          exec "$GH_ASSERT_BINARY" "$GH_ASSERT_CONTRACT"
        fi
        exec "$GH_ASSERT_BINARY"
