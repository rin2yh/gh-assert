version: 2

project_name: gh-assert

builds:
  - main: ./cmd/gh-assert
    binary: gh-assert
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Action は生バイナリを取得するのでアーカイブ化しない
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # tagpr が作成した draft にアセットを追加する
  mode: append
  # tagpr の draft と別の draft が作られないよう、既存のものを使う
  use_existing_draft: true
  # 途中で失敗した実行をやり直せるよう、既存アセットは上書きする
  replace_existing_artifacts: true
  # アセットが揃うまで公開しない。公開は後続ステップで行う
  draft: true

changelog:
  disable: true
