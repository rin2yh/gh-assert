name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          go_build_options: ./cmd/gh-assert
      - name: Build Action binary
        run: |
          mkdir -p dist/action
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/action/gh-assert-linux-amd64 ./cmd/gh-assert
          sha256sum dist/action/gh-assert-linux-amd64 > dist/action/gh-assert-linux-amd64.sha256
      - name: Upload Action binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/action/gh-assert-linux-amd64 dist/action/gh-assert-linux-amd64.sha256 --clobber
